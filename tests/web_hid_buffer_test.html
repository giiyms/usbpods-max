<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebHID DataView regression test</title>
</head>
<body>
  <output id="result" data-result="running">RUNNING</output>
  <iframe id="app" src="../web/index.html" hidden></iframe>
  <script>
    const STATUS_REPORT = [
      0x01, 0x07, 12, 2, 91, 82, 73, 64,
      3, 0, 0, 1, 1, 1, 1, 0xff,
      0x70, 0xf9, 0x4a, 0x8a, 0xd8, 0x54,
      37, 2, 0x12, 0x34, 5, 6, 2, 1, 2, 1
    ];

    const EXPECTED_STATUS = {
      gain: "12 dB",
      slot: "2",
      address: "70:f9:4a:8a:d8:54",
      a2dp: "up",
      owns: "yes",
      sleep: "on"
    };

    const result = document.getElementById("result");
    const iframe = document.getElementById("app");

    function assertEqual(actual, expected, label) {
      if (actual !== expected) {
        throw new Error(label + ": expected " + expected + ", got " + actual);
      }
    }

    function assertObject(actual, expected, label) {
      assertEqual(JSON.stringify(actual), JSON.stringify(expected), label);
    }

    function waitForIframe() {
      if (iframe.contentWindow.location.pathname.endsWith("/web/index.html")
          && iframe.contentDocument.readyState === "complete") {
        return Promise.resolve();
      }
      return new Promise((resolve, reject) => {
        iframe.addEventListener("load", resolve, { once: true });
        iframe.addEventListener("error", () => reject(new Error("application iframe failed to load")), { once: true });
      });
    }

    function makeReport(app, bytes, byteLength = 32) {
      const backing = new app.ArrayBuffer(byteLength + 16);
      new app.Uint8Array(backing).fill(0xa5);
      const view = new app.DataView(backing, 7, byteLength);
      new app.Uint8Array(backing, view.byteOffset, Math.min(bytes.length, byteLength))
        .set(bytes.slice(0, byteLength));
      return view;
    }

    function changedReport(changes) {
      const bytes = STATUS_REPORT.slice();
      for (const [offset, value] of changes) bytes[offset] = value;
      return bytes;
    }

    function dispatchReport(app, device, reportId, data) {
      const event = new app.Event("inputreport");
      Object.defineProperties(event, {
        reportId: { value: reportId },
        data: { value: data }
      });
      device.dispatchEvent(event);
    }

    function renderedStatus(app) {
      const text = (id) => app.document.getElementById(id).textContent;
      return {
        gain: text("fGain"),
        slot: text("stSlot"),
        address: text("stAddr"),
        a2dp: text("fA2dp"),
        owns: text("fOwns"),
        sleep: text("fSleep")
      };
    }

    async function run() {
      await waitForIframe();
      const app = iframe.contentWindow;
      const device = new app.EventTarget();
      device.open = () => Promise.resolve();
      device.close = () => Promise.resolve();
      device.sendReport = () => Promise.resolve();

      Object.defineProperty(app.navigator, "hid", {
        configurable: true,
        value: { requestDevice: () => Promise.resolve([device]) }
      });

      const uncaughtErrors = [];
      app.addEventListener("error", (event) => {
        uncaughtErrors.push(event.message);
        event.preventDefault();
      });

      try {
        await app.connectHid();

        const valid = makeReport(app, STATUS_REPORT);
        assertEqual(valid.byteOffset, 7, "fixture byteOffset");
        assertEqual(valid.byteLength, 32, "fixture byteLength");
        dispatchReport(app, device, 0, valid);
        await new Promise((resolve) => app.setTimeout(resolve, 0));
        assertEqual(uncaughtErrors.length, 0, "offset DataView uncaught errors");
        assertObject(renderedStatus(app), EXPECTED_STATUS, "offset DataView status");

        const snapshot = JSON.stringify(renderedStatus(app));
        const invalidReports = [
          ["31-byte report", 0, makeReport(app, changedReport([[2, 21]]), 31)],
          ["33-byte report", 0, makeReport(app, changedReport([[2, 22]]), 33)],
          ["unknown report type", 0, makeReport(app, changedReport([[0, 0x02], [2, 23]]))],
          ["unsupported protocol major", 0, makeReport(app, changedReport([[13, 0x02], [2, 24]]))],
          ["nonzero report ID", 1, makeReport(app, changedReport([[2, 20]]))]
        ];

        for (const [label, reportId, data] of invalidReports) {
          const errorCount = uncaughtErrors.length;
          dispatchReport(app, device, reportId, data);
          await new Promise((resolve) => app.setTimeout(resolve, 0));
          assertEqual(uncaughtErrors.length, errorCount, label + " uncaught errors");
          assertEqual(JSON.stringify(renderedStatus(app)), snapshot, label);
        }
      } finally {
        const release = app.document.getElementById("btnDisconnectApp");
        if (release) {
          release.click();
          await new Promise((resolve) => app.setTimeout(resolve, 0));
        }
      }
    }

    run().then(() => {
      result.dataset.result = "pass";
      result.textContent = "PASS";
    }).catch((error) => {
      result.dataset.result = "fail";
      result.textContent = "FAIL: " + error.message;
    });
  </script>
</body>
</html>
